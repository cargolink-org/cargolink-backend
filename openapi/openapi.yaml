components:
  schemas:
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code (e.g. 'not_found', 'validation_error', 'rate_limited').
        message:
          type: string
          description: Human-readable explanation of what went wrong, safe to display to an end user.
      required:
      - code
      - message
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
      description: Standard error envelope returned by every endpoint in this API.
    ValidationError:
      type: object
      properties:
        loc:
          type: array
          items:
            anyOf:
            - type: string
            - type: integer
        msg:
          type: string
        type:
          type: string
      required:
      - loc
      - msg
      - type
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    Role:
      type: string
      enum:
      - shipper
      - transporter
      - admin
      description: The user's platform role.
    UserSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique user identifier.
        role:
          $ref: '#/components/schemas/Role'
        name:
          type:
          - string
          - 'null'
          description: Display name, if set during onboarding.
        phone:
          type: string
          pattern: ^\+[1-9]\d{6,14}$
          description: E.164 phone number used for OTP login.
        email:
          type:
          - string
          - 'null'
          format: email
          description: Optional email address.
        created_at:
          type: string
          format: date-time
          description: When this user account was created.
      required:
      - id
      - role
      - phone
      - created_at
    OtpRequestRequest:
      type: object
      properties:
        phone:
          type: string
          pattern: ^\+[1-9]\d{6,14}$
          description: Phone number to send the OTP to, E.164 format (e.g. +919876543210).
          examples:
          - '+919876543210'
      required:
      - phone
    OtpRequestResponse:
      type: object
      properties:
        otp_sent:
          type: boolean
          description: True if the OTP was dispatched (or queued) successfully.
      required:
      - otp_sent
    OtpVerifyRequest:
      type: object
      properties:
        phone:
          type: string
          pattern: ^\+[1-9]\d{6,14}$
          description: Phone number the OTP was requested for.
        otp:
          type: string
          pattern: ^\d{6}$
          description: The 6-digit one-time password received by SMS.
      required:
      - phone
      - otp
    OtpVerifyResponse:
      type: object
      properties:
        token:
          type: string
          description: Short-lived JWT access token (~15 min).
        refresh_token:
          type: string
          description: Longer-lived, rotating refresh token.
        user:
          $ref: '#/components/schemas/UserSummary'
      required:
      - token
      - refresh_token
      - user
    TokenRefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          description: A previously issued, still-valid (unrotated) refresh token.
      required:
      - refresh_token
    TokenRefreshResponse:
      type: object
      properties:
        token:
          type: string
          description: A newly issued short-lived JWT access token.
      required:
      - token
    ShipperProfileCreateRequest:
      type: object
      properties:
        company_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Registered or trading company name.
        gstin:
          type:
          - string
          - 'null'
          pattern: ^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z]{1}[1-9A-Z]{1}Z[0-9A-Z]{1}$
          description: 15-character GST Identification Number. Optional — not every shipper is GST-registered.
          examples:
          - 22AAAAA0000A1Z5
      required:
      - company_name
    ShipperProfileResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          description: The shipper's user id.
        company_name:
          type: string
          description: Registered or trading company name.
        gstin:
          type:
          - string
          - 'null'
          description: 15-character GST Identification Number, if provided.
      required:
      - user_id
      - company_name
    TransporterProfileCreateRequest:
      type: object
      properties:
        license_no:
          type: string
          minLength: 1
          maxLength: 50
          description: Driving/operator license number.
      required:
      - license_no
    TransporterProfileResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          description: The transporter's user id.
        license_no:
          type: string
          description: Driving/operator license number.
        rating_avg:
          type: number
          minimum: 0
          maximum: 5
          default: 0.0
          description: Rolling average rating (0-5), fed back from the ratings module (Cluster H.2).
      required:
      - user_id
      - license_no
    VehicleType:
      type: string
      enum:
      - mini_truck
      - container_truck
      - trailer
      - other
    GeoPoint:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude in decimal degrees (WGS84).
        lng:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude in decimal degrees (WGS84).
      required:
      - lat
      - lng
    VehicleCreateRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/VehicleType'
        capacity_kg:
          type: number
          exclusiveMinimum: 0
          description: Maximum cargo weight capacity, in kilograms.
        capacity_volume:
          type: number
          exclusiveMinimum: 0
          description: Maximum cargo volume capacity, in cubic meters.
        route_pref:
          type:
          - string
          - 'null'
          maxLength: 200
          description: Free-text preferred route/operating corridor, e.g. 'Mumbai-Pune'.
      required:
      - type
      - capacity_kg
      - capacity_volume
    VehicleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique vehicle identifier.
        transporter_id:
          type: string
          format: uuid
          description: Owning transporter's user id.
        type:
          $ref: '#/components/schemas/VehicleType'
        capacity_kg:
          type: number
          description: Maximum cargo weight capacity, in kilograms.
        capacity_volume:
          type: number
          description: Maximum cargo volume capacity, in cubic meters.
        route_pref:
          type:
          - string
          - 'null'
          description: Free-text preferred route/operating corridor.
        current_location:
          anyOf:
          - $ref: '#/components/schemas/GeoPoint'
          - type: 'null'
          description: Last known GPS location, if the vehicle has reported one.
        last_ping_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Timestamp of the last location ping received.
      required:
      - id
      - transporter_id
      - type
      - capacity_kg
      - capacity_volume
    VehicleListResponse:
      type: object
      properties:
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/VehicleResponse'
          description: The calling transporter's registered vehicles.
      required:
      - vehicles
    CargoType:
      type: string
      enum:
      - general
      - fragile
      - hazardous
      - refrigerated
    LoadStatus:
      type: string
      enum:
      - open
      - matched
      - accepted
      - in_transit
      - delivered
      - cancelled
    LoadCreateRequest:
      type: object
      properties:
        weight:
          type: number
          exclusiveMinimum: 0
          description: Cargo weight in kilograms.
        cargo_type:
          $ref: '#/components/schemas/CargoType'
        source:
          $ref: '#/components/schemas/GeoPoint'
        destination:
          $ref: '#/components/schemas/GeoPoint'
        deadline:
          type: string
          format: date-time
          description: Latest acceptable pickup deadline.
      required:
      - weight
      - cargo_type
      - source
      - destination
      - deadline
    LoadCreateResponse:
      type: object
      properties:
        load_id:
          type: string
          format: uuid
          description: Unique identifier for the newly posted load.
        status:
          $ref: '#/components/schemas/LoadStatus'
      required:
      - load_id
      - status
    LoadAcceptRequest:
      type: object
      properties:
        vehicle_id:
          type: string
          format: uuid
          description: The vehicle being assigned to fulfil this load.
      required:
      - vehicle_id
    LoadAcceptResponse:
      type: object
      properties:
        match_id:
          type: string
          format: uuid
          description: Identifier of the created load_matches record.
        status:
          $ref: '#/components/schemas/LoadStatus'
      required:
      - match_id
      - status
    MatchCandidate:
      type: object
      properties:
        vehicle_id:
          type: string
          format: uuid
          description: Candidate vehicle's id.
        distance_km:
          type: number
          minimum: 0
          description: Road distance from vehicle to pickup point, in km (OSRM; falls back to Haversine
            if OSRM is degraded — Cluster C.1).
        capacity_fit:
          type: boolean
          description: Whether the vehicle's capacity satisfies the load's weight/volume.
        eta:
          type: integer
          minimum: 0
          description: Estimated time to pickup, in seconds.
        score:
          type: number
          description: Composite match score (higher is better); see Clusters C.2/H.2 for scoring inputs.
      required:
      - vehicle_id
      - distance_km
      - capacity_fit
      - eta
      - score
    LoadMatchesResponse:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: '#/components/schemas/MatchCandidate'
          description: Candidate vehicles for this load, sorted by score descending. Empty list (not an
            error) when nothing qualifies.
      required:
      - matches
    PricingQuoteResponse:
      type: object
      properties:
        base_fare:
          type: number
          minimum: 0
          description: Flat base component of the fare.
        distance_cost:
          type: number
          minimum: 0
          description: distance_km × rate_per_km component.
        surcharge:
          type: number
          minimum: 0
          description: Sum of weight/type surcharges (e.g. hazardous, refrigerated).
        total:
          type: number
          minimum: 0
          description: Total quoted fare (base_fare + distance_cost + surcharge, demand-adjusted).
      required:
      - base_fare
      - distance_cost
      - surcharge
      - total
    LocationPoint:
      type: object
      properties:
        lat:
          type: number
          minimum: -90
          maximum: 90
          description: Latitude in decimal degrees (WGS84).
        lng:
          type: number
          minimum: -180
          maximum: 180
          description: Longitude in decimal degrees (WGS84).
        timestamp:
          type: string
          format: date-time
          description: When this location was recorded.
      required:
      - lat
      - lng
      - timestamp
    TrackingHistoryResponse:
      type: object
      properties:
        points:
          type: array
          items:
            $ref: '#/components/schemas/LocationPoint'
          description: Location pings for the vehicle within the requested window, chronological order.
      required:
      - points
    DocType:
      type: string
      enum:
      - commercial_invoice
      - packing_list
      - bill_of_lading_or_airway_bill
      - customs_clearance_certificate
      - certificate_of_origin
    DocumentStatus:
      type: string
      enum:
      - Pending
      - Uploaded
      - Verified
      - Cleared
    ShipmentDocumentItem:
      type: object
      properties:
        doc_type:
          $ref: '#/components/schemas/DocType'
        status:
          $ref: '#/components/schemas/DocumentStatus'
        file_url:
          type:
          - string
          - 'null'
          description: Short-lived signed URL to read the uploaded file, if any.
      required:
      - doc_type
      - status
    DocumentChecklistResponse:
      type: object
      properties:
        documents:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentDocumentItem'
          description: The cargo-type-conditional checklist for this load (see Cluster F.1's rules.py).
      required:
      - documents
    DocumentUploadRequest:
      type: object
      properties:
        doc_type:
          $ref: '#/components/schemas/DocType'
      required:
      - doc_type
      description: Metadata accompanying a multipart document upload; the binary file part is handled
        via FastAPI's UploadFile, not modeled here.
    DocumentUploadResponse:
      type: object
      properties:
        doc_id:
          type: string
          format: uuid
          description: Identifier of the created/updated document record.
        status:
          $ref: '#/components/schemas/DocumentStatus'
      required:
      - doc_id
      - status
    CheckpointName:
      type: string
      enum:
      - origin_warehouse
      - port_border
      - customs_hold
      - cleared
      - destination
    CheckpointStatus:
      type: string
      enum:
      - pending
      - in_progress
      - complete
    CheckpointCreateRequest:
      type: object
      properties:
        checkpoint_name:
          $ref: '#/components/schemas/CheckpointName'
        status:
          $ref: '#/components/schemas/CheckpointStatus'
      required:
      - checkpoint_name
      - status
    CheckpointCreateResponse:
      type: object
      properties:
        checkpoint_id:
          type: string
          format: uuid
          description: Identifier of the created checkpoint_updates record.
      required:
      - checkpoint_id
    CheckpointResponse:
      type: object
      properties:
        checkpoint_id:
          type: string
          format: uuid
          description: Identifier of this checkpoint update.
        checkpoint_name:
          $ref: '#/components/schemas/CheckpointName'
        status:
          $ref: '#/components/schemas/CheckpointStatus'
        timestamp:
          type: string
          format: date-time
          description: When this checkpoint update was recorded.
      required:
      - checkpoint_id
      - checkpoint_name
      - status
      - timestamp
    ContainerCreateRequest:
      type: object
      properties:
        container_no:
          type: string
          pattern: ^[A-Z]{4}\d{7}$
          description: ISO 6346 container number, e.g. MSCU1234567.
        vessel_or_flight:
          type: string
          minLength: 1
          maxLength: 100
          description: Vessel name or flight number carrying this container.
        port_of_loading:
          type: string
          minLength: 1
          maxLength: 100
          description: Port/airport where the container was loaded.
        port_of_discharge:
          type: string
          minLength: 1
          maxLength: 100
          description: Port/airport where the container will be discharged.
      required:
      - container_no
      - vessel_or_flight
      - port_of_loading
      - port_of_discharge
    ContainerUpdateRequest:
      type: object
      properties:
        container_no:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{4}\d{7}$
          description: ISO 6346 container number.
        vessel_or_flight:
          type:
          - string
          - 'null'
          maxLength: 100
          description: Vessel name or flight number.
        port_of_loading:
          type:
          - string
          - 'null'
          maxLength: 100
          description: Port/airport where the container was loaded.
        port_of_discharge:
          type:
          - string
          - 'null'
          maxLength: 100
          description: Port/airport where the container will be discharged.
    ContainerResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique container record identifier.
        load_id:
          type: string
          format: uuid
          description: The load this container data belongs to.
        container_no:
          type: string
          description: ISO 6346 container number.
        vessel_or_flight:
          type: string
          description: Vessel name or flight number.
        port_of_loading:
          type: string
          description: Port/airport where the container was loaded.
        port_of_discharge:
          type: string
          description: Port/airport where the container will be discharged.
      required:
      - id
      - load_id
      - container_no
      - vessel_or_flight
      - port_of_loading
      - port_of_discharge
    NotificationType:
      type: string
      enum:
      - booking_confirmation
      - pickup_confirmation
      - delay_alert
      - delivery_confirmation
    NotificationResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique notification identifier.
        type:
          $ref: '#/components/schemas/NotificationType'
        message:
          type: string
          description: Human-readable notification text.
        sent_at:
          type: string
          format: date-time
          description: When this notification was created/sent.
        read:
          type: boolean
          default: false
          description: Whether the recipient has marked this notification read.
      required:
      - id
      - type
      - message
      - sent_at
    NotificationListResponse:
      type: object
      properties:
        notifications:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
          description: The calling user's notifications, most recent first.
      required:
      - notifications
    RouteStat:
      type: object
      properties:
        route:
          type: string
          description: Corridor label, e.g. 'Mumbai -> Delhi'.
        shipment_count:
          type: integer
          minimum: 0
          description: Number of shipments on this route in the reporting window.
      required:
      - route
      - shipment_count
    AdminStatsOverviewResponse:
      type: object
      properties:
        active:
          type: integer
          minimum: 0
          description: Count of currently active (in-progress) shipments.
        completed:
          type: integer
          minimum: 0
          description: Count of completed shipments.
        delayed:
          type: integer
          minimum: 0
          description: Count of shipments currently flagged delayed.
        revenue:
          type: number
          minimum: 0
          description: Gross revenue for the reporting window.
        top_routes:
          type: array
          items:
            $ref: '#/components/schemas/RouteStat'
          description: Most popular corridors, ranked by shipment count.
      required:
      - active
      - completed
      - delayed
      - revenue
      - top_routes
    RatingCreateRequest:
      type: object
      properties:
        load_id:
          type: string
          format: uuid
          description: The completed load this rating is for.
        ratee_id:
          type: string
          format: uuid
          description: The counterparty being rated. Verified server-side against the load's actual participants,
            never trusted blindly (Cluster H.2).
        score:
          type: integer
          minimum: 1
          maximum: 5
          description: Star rating, 1 (worst) to 5 (best).
        comment:
          type:
          - string
          - 'null'
          maxLength: 1000
          description: Optional free-text comment.
      required:
      - load_id
      - ratee_id
      - score
    RatingCreateResponse:
      type: object
      properties:
        rating_id:
          type: string
          format: uuid
          description: Identifier of the created rating record.
      required:
      - rating_id
